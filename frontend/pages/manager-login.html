<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Sign In — HostelHub</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrapper" style="background: linear-gradient(135deg, #4c1d95, #7c3aed);">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="/index.html" style="text-decoration:none;">
        <h1>🏠 HostelHub</h1>
      </a>
      <p>Manager Portal</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="alert-box"></div>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" placeholder="manager@hostel.com" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-secondary btn-full btn-lg" id="login-btn">Sign In</button>
      <p class="text-center mt-2" style="font-size:.88rem;">
        Are you a student? <a href="/pages/student-login.html">Student sign in →</a>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Jane Smith" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input type="email" id="reg-email" placeholder="manager@hostel.com" required />
      </div>
      <div class="form-group">
        <label for="reg-phone">Phone Number</label>
        <input type="tel" id="reg-phone" placeholder="+233 XX XXX XXXX" />
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Min 6 characters" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input type="password" id="reg-confirm" placeholder="Re-enter password" required />
      </div>
      <button type="submit" class="btn btn-secondary btn-full btn-lg" id="register-btn">Create Manager Account</button>
      <p class="text-center mt-2" style="font-size:.88rem;">
        Are you a student? <a href="/pages/student-login.html">Student registration →</a>
      </p>
    </form>

  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const existingUser = getUser();
  if (existingUser && existingUser.role === 'manager') {
    window.location.href = '/pages/manager-dashboard.html';
  }

  function switchTab(tab) {
    clearAlert(document.getElementById('alert-box'));
    document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
    document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alert-box');
    const btn = document.getElementById('login-btn');
    clearAlert(alertBox);
    setLoading(btn, true);
    try {
      const data = await api.post('/auth/login', {
        email: document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value,
        role: 'manager'
      });
      setAuth(data.token, data.user);
      window.location.href = '/pages/manager-dashboard.html';
    } catch (err) {
      showAlert(alertBox, err.message);
      setLoading(btn, false, 'Sign In');
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alert-box');
    const btn = document.getElementById('register-btn');
    clearAlert(alertBox);

    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;
    if (password !== confirm) { showAlert(alertBox, 'Passwords do not match'); return; }

    setLoading(btn, true);
    try {
      const data = await api.post('/auth/register', {
        name:     document.getElementById('reg-name').value.trim(),
        email:    document.getElementById('reg-email').value.trim(),
        password,
        phone:    document.getElementById('reg-phone').value.trim(),
        role:     'manager'
      });
      setAuth(data.token, data.user);
      window.location.href = '/pages/manager-dashboard.html';
    } catch (err) {
      showAlert(alertBox, err.message);
      setLoading(btn, false, 'Create Manager Account');
    }
  }
</script>
</body>
</html>
